# Load balancer + edge cache in front of the web (Next.js) and api (Express) replicas.
# Docker's DNS returns every replica's IP for "web" / "api"; nginx balances across them.
worker_processes auto;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:20m max_size=500m inactive=7d use_temp_path=off;

  upstream web { least_conn; server web:3000 max_fails=3 fail_timeout=10s; keepalive 32; }
  upstream api { least_conn; server api:4000 max_fails=3 fail_timeout=10s; keepalive 32; }

  server {
    listen 80;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://api; }
    location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://api; }

    location /_next/static/ {
      proxy_pass http://web;
      proxy_cache static; proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /img/ {
      proxy_pass http://web;
      proxy_cache static; proxy_cache_valid 200 30d;
    }
    location / { proxy_pass http://web; }
  }
}
